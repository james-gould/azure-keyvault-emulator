name: Release Version Update

on:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Authenticate Azure CLI
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Validate container tag versions match git tag
        run: |
          set -euo pipefail

          GIT_TAG=$(git describe --tags --abbrev=0)
          VERSION=${GIT_TAG#v}

          echo "Latest git tag: $GIT_TAG (version: $VERSION)"

          FILES=(
            "src/AzureKeyVaultEmulator.Aspire.Hosting/Constants/KeyVaultEmulatorContainerConstants.cs"
            "src/TestContainers/dotnet/Constants/AzureKeyVaultEmulatorContainerConstants.cs"
          )

          FAILED=0

          for FILE in "${FILES[@]}"; do
            if ! grep -q "public const string Tag = \"$VERSION\";" "$FILE"; then
              echo "::error file=$FILE::Tag constant does not match the latest git tag '$VERSION'."
              FAILED=1
            else
              echo "$FILE is up to date."
            fi
          done

          exit $FAILED

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Install SSL Certificates
        run: |
          dotnet dev-certs https --clean
          dotnet dev-certs https --trust
        continue-on-error: true

      - name: Restore dependencies
        run: dotnet restore

      - name: Dotnet Build
        run: dotnet build --configuration Release --no-restore

      - name: Run API Integration Tests
        run: dotnet test ./test/AzureKeyVaultEmulator.IntegrationTests/AzureKeyVaultEmulator.IntegrationTests.csproj

      - name: Run TestContainers Integration Tests
        run: dotnet test ./test/AzureKeyVaultEmulator.TestContainers.Tests/AzureKeyVaultEmulator.TestContainers.Tests.csproj

      - name: Run DefaultAzureCredential Tests
        run: dotnet test ./test/AzureKeyVaultEmulator.DefaultAzureCredentialTests/AzureKeyVaultEmulator.DefaultAzureCredentialTests.csproj
